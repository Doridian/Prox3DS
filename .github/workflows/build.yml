name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The chip patches (devkitARM gcc + tools/mkpatch.py) and both nfcprobe builds.
  nfcprobe:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python3
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Chip patches
        run: make -C chip
      - name: nfcprobe (debug)
        run: make -C nfcprobe -j"$(nproc)"
      - name: nfcprobe (release)
        run: make -C nfcprobe -j"$(nproc)" release
      - uses: actions/upload-artifact@v4
        with:
          name: nfcprobe
          path: |
            nfcprobe/nfcprobe.3dsx
            nfcprobe/nfcprobe-release.3dsx

  # The UI on the host (nfcprobe/sim): every scene rendered and its text layout checked.
  uisim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc-multilib, Pillow, NanumGothic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib python3-pil fonts-nanum
      - name: Render scenes
        run: make -C nfcprobe/sim run
        env:
          SIM_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      - name: Layout check
        # "tight" is within the stand-in font's error; anything else is a real layout bug
        run: |
          if grep -E ': (offscreen|clipped|overflow|overlap):' nfcprobe/sim/out/report.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uisim
          path: nfcprobe/sim/out
