name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The chip patches (devkitARM gcc + tools/mkpatch.py) and both Prox3DS builds.
  Prox3DS:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install python3
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Chip patches
        run: make -C chip
      - name: Prox3DS (debug)
        run: make -C prox3ds -j"$(nproc)"
      - name: Prox3DS (release)
        run: make -C prox3ds -j"$(nproc)" release
      - uses: actions/upload-artifact@v7
        with:
          name: Prox3DS
          path: |
            prox3ds/prox3ds.3dsx
            prox3ds/prox3ds-release.3dsx

  # The UI on the host (prox3ds/sim): every scene rendered and its text layout checked.
  uisim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gcc-multilib, Pillow, NanumGothic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib python3-pil fonts-nanum
      - name: Render scenes
        run: make -C prox3ds/sim run
        env:
          SIM_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      - name: Layout check
        # "tight" is within the stand-in font's error; anything else is a real layout bug
        run: |
          if grep -E ': (offscreen|clipped|overflow|overlap):' prox3ds/sim/out/report.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uisim
          # only the renders and the report: out/ is also the sim's fake SD card (out/sdmc:/...), and
          # artifact paths can't hold a ':'
          path: |
            prox3ds/sim/out/*.png
            prox3ds/sim/out/*.txt

  # A v* tag: both builds as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Prox3DS, uisim]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Prox3DS
      - name: Name the files
        run: |
          mv prox3ds-release.3dsx Prox3DS.3dsx
          mv prox3ds.3dsx Prox3DS-debug.3dsx
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Prox3DS.3dsx
            Prox3DS-debug.3dsx
