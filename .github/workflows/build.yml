name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the older run. Tags are their own ref, so a release run
# is never cancelled by a later push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The chip patches (devkitARM gcc + tools/mkpatch.py) and both Prox3DS builds.
  Prox3DS:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install python3
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Install makerom, bannertool
        # for the CIAs; not part of devkitPro. Pinned and checksummed.
        run: |
          mkdir -p "$RUNNER_TEMP/ctrtools" && cd "$RUNNER_TEMP/ctrtools"
          curl -fsSLo makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -fsSLo bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c - <<'SUMS'
          287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  makerom.zip
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          python3 -m zipfile -e makerom.zip makerom
          python3 -m zipfile -e bannertool.zip bannertool
          install -m755 makerom/makerom bannertool/linux-x86_64/bannertool /usr/local/bin/
      - name: Chip patches
        run: make -C chip
      - name: Prox3DS (debug)
        run: make -C prox3ds -j"$(nproc)" cia
      - name: Prox3DS (release)
        run: make -C prox3ds -j"$(nproc)" release-cia
      - uses: actions/upload-artifact@v7
        with:
          name: Prox3DS
          path: |
            prox3ds/prox3ds.3dsx
            prox3ds/prox3ds-release.3dsx
            prox3ds/prox3ds.cia
            prox3ds/prox3ds-release.cia

  # The UI on the host (prox3ds/sim): every scene rendered and its text layout checked.
  uisim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gcc-multilib, Pillow, NanumGothic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib python3-pil fonts-nanum
      - name: Render scenes
        run: make -C prox3ds/sim run
        env:
          SIM_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      - name: Layout check
        # "tight" is within the stand-in font's error; anything else is a real layout bug
        run: |
          if grep -E ': (offscreen|clipped|overflow|overlap):' prox3ds/sim/out/report.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uisim
          # only the renders and the report: out/ is also the sim's fake SD card (out/sdmc:/...), and
          # artifact paths can't hold a ':'
          path: |
            prox3ds/sim/out/*.png
            prox3ds/sim/out/*.txt

  # A v* tag: both builds (.3dsx and .cia) as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Prox3DS, uisim]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Prox3DS
      - name: Name the files
        run: |
          mv prox3ds-release.3dsx Prox3DS.3dsx
          mv prox3ds.3dsx Prox3DS-debug.3dsx
          mv prox3ds-release.cia Prox3DS.cia
          mv prox3ds.cia Prox3DS-debug.cia
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Prox3DS.3dsx
            Prox3DS-debug.3dsx
            Prox3DS.cia
            Prox3DS-debug.cia
