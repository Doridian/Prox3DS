name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the older run. Tags are their own ref, so a release run
# is never cancelled by a later push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The chip patches (devkitARM gcc + tools/mkpatch.py) and both Prox3DS builds.
  Prox3DS:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install python3
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Install makerom, bannertool
        # for the CIA; not part of devkitPro. Pinned and checksummed. makerom is built from source: its
        # prebuilt Linux binary needs a newer glibc than this container has.
        run: |
          command -v gcc && command -v g++ || (apt-get update && apt-get install -y --no-install-recommends build-essential)
          mkdir -p "$RUNNER_TEMP/ctrtools" && cd "$RUNNER_TEMP/ctrtools"
          curl -fsSLo ctr.tar.gz https://github.com/3DSGuy/Project_CTR/archive/refs/tags/makerom-v0.19.0.tar.gz
          curl -fsSLo bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c - <<'SUMS'
          446bd23919b7e9fa10540a784202d388a0b93ef4d7165f3990481edd2aa2f946  ctr.tar.gz
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          tar xzf ctr.tar.gz
          make -C Project_CTR-makerom-v0.19.0/makerom -j"$(nproc)" deps
          make -C Project_CTR-makerom-v0.19.0/makerom -j"$(nproc)" program
          python3 -m zipfile -e bannertool.zip bannertool
          install -m755 Project_CTR-makerom-v0.19.0/makerom/bin/makerom bannertool/linux-x86_64/bannertool /usr/local/bin/
      - name: Chip patches
        run: make -C chip
      - name: Prox3DS (debug)
        run: make -C prox3ds -j"$(nproc)"
      - name: Prox3DS (release, .3dsx and .cia)
        run: make -C prox3ds -j"$(nproc)" cia
      - uses: actions/upload-artifact@v7
        with:
          name: Prox3DS
          path: |
            prox3ds/prox3ds.3dsx
            prox3ds/prox3ds-release.3dsx
            prox3ds/prox3ds-release.cia

  # The UI on the host (prox3ds/sim): every scene rendered and its text layout checked.
  uisim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gcc-multilib, Pillow, NanumGothic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib python3-pil fonts-nanum
      - name: Render scenes
        run: make -C prox3ds/sim run
        env:
          SIM_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      - name: Layout check
        # "tight" is within the stand-in font's error; anything else is a real layout bug
        run: |
          if grep -E ': (offscreen|clipped|overflow|overlap):' prox3ds/sim/out/report.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uisim
          # only the renders and the report: out/ is also the sim's fake SD card (out/sdmc:/...), and
          # artifact paths can't hold a ':'
          path: |
            prox3ds/sim/out/*.png
            prox3ds/sim/out/*.txt

  # A v* tag: both builds as a GitHub release, plus the release build as a CIA.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Prox3DS, uisim]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Prox3DS
      - name: Name the files
        run: |
          mv prox3ds-release.3dsx Prox3DS.3dsx
          mv prox3ds.3dsx Prox3DS-debug.3dsx
          mv prox3ds-release.cia Prox3DS.cia
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Prox3DS.3dsx
            Prox3DS-debug.3dsx
            Prox3DS.cia
